version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      # A new contract version arrives as its own PR, whose CI shows what the
      # API change breaks.
      api-contract:
        patterns:
          - 'poli-page/api-contract'
      github-actions:
        patterns:
          - '*'
        exclude-patterns:
          - 'poli-page/api-contract'
    # Dependabot waits 3 days after a release by default; exempt the contract.
    cooldown:
      default-days: 3
      exclude:
        - 'poli-page/api-contract'

  - package-ecosystem: bundler
    directories:
      - /
      - /example-app
    schedule:
      interval: weekly
