name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ruby 3.1 is excluded: poli-page (the SDK) and poli_page-rails both
        # declare required_ruby_version >= 3.2, so 3.1 can never resolve.
        ruby: ['3.2', '3.3', '3.4']
        rails: ['7.0', '7.1', '7.2', '8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Pin Rails via Appraisal
        # `appraisal NAME install` is invalid: NAME is consumed as the
        # appraisal scope and `install` is run as an external command (the
        # /usr/bin/install binary), which fails. Generate the per-Rails
        # gemfiles, then bundle install only the one this job needs.
        run: |
          bundle exec appraisal generate
          BUNDLE_GEMFILE="gemfiles/rails_${{ matrix.rails }}.gemfile" bundle install --jobs 4 --retry 3
      - name: Lint
        run: bundle exec rubocop
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: Specs
        # Includes spec/contract (the API contract's integration cases against
        # the example app); spec/integration needs the real API and runs in
        # the integration job.
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: bundle exec appraisal "rails-${{ matrix.rails }}" rspec --exclude-pattern "spec/integration/**/*"

  example-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-app
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: example-app
      - name: Boot and eager-load the example app
        env:
          POLI_PAGE_API_KEY: pp_sandbox_0123456789abcdef0123456789abcdef
        run: bin/rails zeitwerk:check

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: Integration spec against the Poli Page API
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_DEVELOP_API_KEY }}
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: bundle exec rspec spec/integration
