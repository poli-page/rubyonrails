name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required by the Codecov uploader (use_oidc: true) so it can mint a
  # short-lived OIDC token instead of relying on a CODECOV_TOKEN secret.
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Ruby 3.1 is excluded: poli-page (the SDK) and poli_page-rails both
        # declare required_ruby_version >= 3.2, so 3.1 can never resolve.
        ruby: ['3.2', '3.3', '3.4']
        rails: ['7.0', '7.1', '7.2', '8.0']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Pin Rails via Appraisal
        # `appraisal NAME install` is invalid: NAME is consumed as the
        # appraisal scope and `install` is run as an external command (the
        # /usr/bin/install binary), which fails. Generate the per-Rails
        # gemfiles, then bundle install only the one this job needs.
        run: |
          bundle exec appraisal generate
          BUNDLE_GEMFILE="gemfiles/rails_${{ matrix.rails }}.gemfile" bundle install --jobs 4 --retry 3
      - name: Lint
        run: bundle exec rubocop
      - name: RBS validate
        # The collection supplies the Rails and stdlib types that sig/ refers
        # to; the lock file is generated, not committed.
        run: |
          bundle exec rbs collection install
          bundle exec rbs -I sig validate
      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0
      - name: Specs
        # Includes spec/contract (the API contract's integration cases against
        # the example app); spec/integration needs the real API and runs in
        # the integration job.
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: bundle exec appraisal "rails-${{ matrix.rails }}" rspec --exclude-pattern "spec/integration/**/*"

      - name: Upload coverage to Codecov
        # Only upload once per CI run: the matrix would otherwise upload the
        # same report 12 times. Tokenless: Codecov uses the GitHub OIDC token
        # for public-repo uploads, so no CODECOV_TOKEN secret is required.
        if: matrix.ruby == '3.4' && matrix.rails == '8.0'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: false

  example-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example-app
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: example-app
      - name: Boot and eager-load the example app
        env:
          POLI_PAGE_API_KEY: pp_sandbox_0123456789abcdef0123456789abcdef
        run: bin/rails zeitwerk:check

  integration:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: ruby/setup-ruby@v1
        if: steps.key.outputs.present == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: API contract
        id: contract
        if: steps.key.outputs.present == 'true'
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0
      - name: Live API spec (sandbox key)
        if: steps.key.outputs.present == 'true'
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          # An unset secret expands to an empty string; drop it so the SDK
          # falls back to its default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          bundle exec rspec spec/integration
